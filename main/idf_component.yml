## IDF Component Manager Manifest File
##
## Trimmed for the Waveshare ESP32-S3-Touch-AMOLED-1.8 single-board build.
## Only components actually referenced by main/ are kept. ESP-IDF v6.0.x
## tightened component-resolution; many third-party panel/touch drivers in
## the upstream xiaozhi-esp32 manifest do not yet build under v6.
dependencies:
  # Display: SH8601 AMOLED + FT5x06 capacitive touch + TCA9554 IO expander
  waveshare/esp_lcd_sh8601: 1.0.2
  espressif/esp_lcd_touch_ft5x06: ~1
  espressif/esp_io_expander_tca9554: ^2.0.3

  # Audio
  espressif/esp_audio_effects: ~1.2.1
  espressif/esp_audio_codec: ~2.4.1
  espressif/esp_codec_dev: ~1.5.6
  espressif/esp-sr: ^2.4.3

  # UI / graphics
  lvgl/lvgl: ~9.5.0
  esp_lvgl_port: ~2.7.2
  78/xiaozhi-fonts: ~1.6.0
  espressif2022/esp_emote_expression: ^1.0.0
  espressif/esp_mmap_assets: ^1.3.2
  espressif/esp_new_jpeg: ^0.6.1
  espressif/esp_image_effects:
    version: ^1.0.1
    rules:
    - if: target not in [esp32]

  # Networking + transport
  78/esp-wifi-connect: ^3.1.3
  78/esp-ml307: '*'
  espressif/mqtt: '*'   # v6: built-in mqtt removed -> managed component
  espressif/cjson: '*'  # v6: built-in json removed -> managed component
  78/uart-eth-modem:
    version: ~0.3.4
    rules:
    - if: target not in [esp32]
  espressif/iot_usbh_rndis:
    version: ^0.3.1
    rules:
    - if: target in [esp32s3, esp32p4]

  # Peripherals + power
  espressif/led_strip: ~3.0.2
  espressif/button: ~4.1.5
  espressif/knob: ^1.0.0
  espressif/adc_battery_estimation: ^0.2.1

  # Camera (esp32s3)
  espressif/esp32-camera:
    version: ^2.1.6
    rules:
    - if: target in [esp32s3]
  espressif/esp_video:
    version: ^2.1.0   # 2.x ships v6.0-compatible esp_cam_sensor
    rules:
    - if: target in [esp32p4, esp32s3]

  ## Required IDF version
  idf:
    version: '>=6.0'
